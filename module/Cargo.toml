[package]
name = "rbmod"
version = "0.1.0"
edition = "2021"
description = "In-process mod runtime for rekordbox 6.8.5, loaded through a version.dll proxy"

[lib]
name = "version"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Performance"] }

[profile.release]
panic = "abort"
opt-level = 2

[build-dependencies]
cc = "1.11.3"
