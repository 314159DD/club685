[package]
name = "club685-probe"
version = "0.1.0"
edition = "2021"
description = "Temporary harness: capture, analyze and drive the overlays for a few seconds"

[dependencies]
club685-core = { path = "../club685-core" }
club685-capture = { path = "../club685-capture" }
club685-overlay = { path = "../club685-overlay" }
png = "0.17"
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
