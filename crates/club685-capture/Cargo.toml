[package]
name = "club685-capture"
version = "0.1.0"
edition = "2021"
description = "Finds the rekordbox 6.8.5 window and captures it with Windows.Graphics.Capture"

[dependencies]
club685-core = { path = "../club685-core" }
windows = { workspace = true, features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }
