[package]
name = "club685-overlay"
version = "0.1.0"
edition = "2021"
description = "Click-through topmost overlay windows and the gate that decides when they may be shown"

[dependencies]
club685-core = { path = "../club685-core" }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
